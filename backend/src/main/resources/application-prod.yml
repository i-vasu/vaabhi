# Production (VPS). Activated by SPRING_PROFILES_ACTIVE=prod, which the Docker image sets.
# No fallbacks for connection details or secrets: the app refuses to start if any is missing.
spring:
  datasource:
    # Neon postgres:// URLs are converted by PostgresUrlEnvironmentPostProcessor (it also sets the credentials).
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}

vaabhi:
  security:
    jwt-secret: ${JWT_SECRET}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}
  # WhatsApp sends once MSG91_AUTH_KEY is set (number and template names come from application.yml). Until
  # WHATSAPP_LOGIN_TEMPLATE is set too, phone sign-in answers 503 (Google still works).
  whatsapp:
    provider: ${WHATSAPP_PROVIDER:msg91}
  # Nightly books backup to S3-compatible storage in India. On in production; it stays idle until the endpoint, bucket, keys and the direct
  # database URL are in /opt/vaabhi/.env (BACKUP_*).
  backup:
    enabled: ${BACKUP_ENABLED:true}

management:
  otlp:
    metrics:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:true}
  logging:
    export:
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:true}
  opentelemetry:
    resource-attributes:
      deployment.environment: ${DEPLOY_ENV:production}
  tracing:
    export:
      enabled: ${OTEL_EXPORT_ENABLED:true}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}
