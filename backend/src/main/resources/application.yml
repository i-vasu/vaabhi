# Settings shared by every profile. Profile files hold what differs:
#   application-dev.yml   local development, CI and tests (the default when no profile is set)
#   application-prod.yml  production (set SPRING_PROFILES_ACTIVE=prod; the Docker image does)
spring:
  application:
    name: vaabhi-backend
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  cache:
    cache-names: categories,facets
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m,recordStats
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful
  forward-headers-strategy: framework

vaabhi:
  # security.jwt-secret and security.cors-allowed-origins are set per profile.

  # Admin dashboard sign-in. The owner account is created on first start only (while no staff exist).
  staff:
    token-ttl: ${STAFF_TOKEN_TTL:12h}
    owner:
      name: ${STAFF_OWNER_NAME:Owner}
      email: ${STAFF_OWNER_EMAIL:}
      password: ${STAFF_OWNER_PASSWORD:}

  # Cloudflare R2 for product photos (credentials only on the VPS, in .env).
  media:
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket: ${R2_BUCKET:vaabhi-media}

  # Online payments for storefront checkout (Razorpay dashboard → Settings → API Keys and → Webhooks).
  # Without the keys, checkout answers 503 "Online payment is not set up".
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

  # Shipping online orders (Shiprocket → Settings → API: create an API user; Pickup Addresses for the location name).
  # Without the API user, "Ship with Shiprocket" answers 503 and checkout skips the pincode check.
  shiprocket:
    email: ${SHIPROCKET_EMAIL:}
    password: ${SHIPROCKET_PASSWORD:}
    pickup-location: ${SHIPROCKET_PICKUP_LOCATION:Primary}
    pickup-pincode: ${SHIPROCKET_PICKUP_PINCODE:}
    webhook-token: ${SHIPROCKET_WEBHOOK_TOKEN:}
    # The parcel every order is booked as (products have no weight yet).
    weight-kg: ${SHIPROCKET_WEIGHT_KG:0.5}
    length-cm: ${SHIPROCKET_LENGTH_CM:30}
    breadth-cm: ${SHIPROCKET_BREADTH_CM:25}
    height-cm: ${SHIPROCKET_HEIGHT_CM:5}

  # Home-page reels from the shop's Instagram (Meta app → Use cases → Instagram API → API setup with Unified login:
  # the account id shown there, and its Generate token, a system-user token that does not expire). Synced hourly;
  # covers are copied to R2. Without both values the section stays hidden.
  instagram:
    access-token: ${INSTAGRAM_ACCESS_TOKEN:}
    account-id: ${INSTAGRAM_ACCOUNT_ID:}

  # Product feed for Meta Commerce Manager (Instagram Shopping + WhatsApp catalogue):
  # https://api.vaabhi.com/api/v1/store/catalog/meta-feed.csv. Rows link to these public addresses.
  catalog-feed:
    storefront-url: ${STOREFRONT_URL:https://vaabhi.com}
    media-url: ${MEDIA_URL:https://media.vaabhi.com}
  # Instant updates to the same Meta catalogue through the Catalog API (see docs/META_CATALOG.md). Without both,
  # Meta only sees changes when it next fetches the feed above.
  meta-catalog:
    catalog-id: ${META_CATALOG_ID:}
    access-token: ${META_CATALOG_TOKEN:}

  # Storefront shipping: free from this order value (items, in rupees), otherwise the flat fee.
  checkout:
    free-shipping-from-rupees: ${FREE_SHIPPING_FROM_RUPEES:1999}
    shipping-rupees: ${SHIPPING_RUPEES:99}
    # Days after delivery the customer can ask to return items.
    return-days: ${RETURN_DAYS:7}
    # The shop's website, linked from order emails.
    storefront-url: ${STOREFRONT_URL:https://vaabhi.com}

  # Customer sign-in. Without GOOGLE_CLIENT_ID, Google sign-in answers 503 (phone sign-in still works).
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID:}

  # Order emails to customers over SMTP (MSG91 Email, Google Workspace, ZeptoMail, SES…). Without MAIL_HOST,
  # emails go to the backend log in development and are skipped in production.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
    reply-to: ${MAIL_REPLY_TO:}

  # WhatsApp through MSG91 is the only customer messaging channel (no SMS). "log" prints messages (dev), "msg91"
  # sends them (prod default). Each message needs a template approved by Meta in MSG91; a message whose template
  # name is empty is not sent. Phone sign-in needs the sign-in template (WHATSAPP_LOGIN_TEMPLATE, Authentication
  # category); without it the storefront offers Google only.
  # params: which values fill {{1}}, {{2}}, … of each template, in order (comma-separated).
  whatsapp:
    provider: ${WHATSAPP_PROVIDER:log}
    auth-key: ${MSG91_AUTH_KEY:}
    integrated-number: ${WHATSAPP_NUMBER:917569189366}
    language-code: ${WHATSAPP_LANGUAGE:en}
    namespace: ${WHATSAPP_NAMESPACE:}
    templates:
      otp: ${WHATSAPP_LOGIN_TEMPLATE:}
      web_order_placed: ${WHATSAPP_ORDER_PLACED_TEMPLATE:vaabhi_order_placed}
      web_order_shipped: ${WHATSAPP_ORDER_SHIPPED_TEMPLATE:vaabhi_order_shipped}
      web_order_delivered: ${WHATSAPP_ORDER_DELIVERED_TEMPLATE:vaabhi_order_delivered}
      web_order_cancelled: ${WHATSAPP_ORDER_CANCELLED_TEMPLATE:vaabhi_order_cancelled}
    params:
      otp: ${WHATSAPP_LOGIN_PARAMS:otp}
      web_order_placed: ${WHATSAPP_ORDER_PLACED_PARAMS:order,amount,payment}
      web_order_shipped: ${WHATSAPP_ORDER_SHIPPED_PARAMS:order,courier,tracking}
      web_order_delivered: ${WHATSAPP_ORDER_DELIVERED_PARAMS:order}
      web_order_cancelled: ${WHATSAPP_ORDER_CANCELLED_PARAMS:order,refund}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  # Grafana Cloud OTLP gateway, e.g. https://otlp-gateway-prod-ap-south-1.grafana.net/otlp
  # Authorization header: "Basic base64(<instance-id>:<access-policy-token>)"
  otlp:
    metrics:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}
        url: ${GRAFANA_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 60s
        headers:
          Authorization: ${GRAFANA_OTLP_AUTH:}
  logging:
    export:
      otlp:
        # Boot 4 name; the old management.otlp.logging.export.enabled is ignored (and this defaults to true).
        enabled: ${OTEL_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.namespace: vaabhi
      deployment.environment: ${DEPLOY_ENV:local}
    tracing:
      export:
        otlp:
          endpoint: ${GRAFANA_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
          headers:
            Authorization: ${GRAFANA_OTLP_AUTH:}
    logging:
      export:
        otlp:
          endpoint: ${GRAFANA_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
          headers:
            Authorization: ${GRAFANA_OTLP_AUTH:}
  tracing:
    export:
      enabled: ${OTEL_EXPORT_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING:0.1}

springdoc:
  model-converters:
    # Types @Nullable (JSpecify) properties as nullable in the API spec.
    java-nullable-property-customizer:
      enabled: true
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
