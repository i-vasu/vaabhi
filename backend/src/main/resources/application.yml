spring:
  application:
    name: vaabhi-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vaabhi}
    username: ${DATABASE_USERNAME:vaabhi}
    password: ${DATABASE_PASSWORD:vaabhi}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  cache:
    cache-names: categories,facets
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m,recordStats
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful
  forward-headers-strategy: framework

vaabhi:
  security:
    # Dev-only default. Production sets JWT_SECRET (32+ random bytes).
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

  # Cloudflare R2 for product photos (credentials only on the VPS, in .env).
  media:
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket: ${R2_BUCKET:vaabhi-media}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  # Grafana Cloud OTLP gateway, e.g. https://otlp-gateway-prod-ap-south-1.grafana.net/otlp
  # Authorization header: "Basic base64(<instance-id>:<access-policy-token>)"
  otlp:
    metrics:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}
        url: ${GRAFANA_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 60s
        headers:
          Authorization: ${GRAFANA_OTLP_AUTH:}
    logging:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.namespace: vaabhi
      deployment.environment: ${DEPLOY_ENV:local}
    tracing:
      export:
        otlp:
          endpoint: ${GRAFANA_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
          headers:
            Authorization: ${GRAFANA_OTLP_AUTH:}
    logging:
      export:
        otlp:
          endpoint: ${GRAFANA_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
          headers:
            Authorization: ${GRAFANA_OTLP_AUTH:}
  tracing:
    export:
      enabled: ${OTEL_EXPORT_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING:0.1}

springdoc:
  model-converters:
    # Types @Nullable (JSpecify) properties as nullable in the API spec.
    java-nullable-property-customizer:
      enabled: true
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
