name: CI/CD

# One pipeline for pull requests and for main.
#   PR:   changes → backend · frontend · e2e → sonar, plus an admin preview on Cloudflare Pages
#   main: same checks → publish images → deploy VPS + admin (one approval) → production smoke tests
# Job names backend, frontend, e2e and sonar are required checks in the main ruleset.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  # Supersede outdated PR runs; never cancel a run on main (it may be deploying).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # Which parts changed. Skipped jobs count as passed for required checks.
  # PRs test only what changed. A deploying run on main tests everything: SonarQube Cloud judges main's new code
  # since the last release, so a skipped suite would leave its new code at 0% coverage and fail the gate.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
      deployable: ${{ steps.diff.outputs.deployable }}
      test_all: ${{ steps.diff.outputs.test_all }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            files=$(git diff --name-only "$BEFORE" HEAD)
          else
            files="backend/ frontend/ infra/"
          fi
          has() { echo "$files" | grep -qE "$1" && echo true || echo false; }
          pipeline='^\.github/workflows/(pipeline|deploy|deploy-admin|smoke)\.yml'
          backend=$(has "^backend/|$pipeline")
          frontend=$(has "^frontend/|$pipeline")
          infra=$(has "^infra/")
          deployable=false
          if [ "$backend" = true ] || [ "$frontend" = true ] || [ "$infra" = true ]; then deployable=true; fi
          test_all=false
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$deployable" = true ]; then test_all=true; fi
          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "deployable=$deployable"
            echo "test_all=$test_all"
          } | tee -a "$GITHUB_OUTPUT"

  backend:
    name: backend
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.test_all == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Error Prone, Spotless, unit + integration tests (Testcontainers), JaCoCo ≥ 70%, Modulith, ArchUnit
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v7
        with:
          name: backend-build
          retention-days: 3
          path: |
            backend/target/app.jar
            backend/target/classes
            backend/target/test-classes
            backend/target/site/jacoco/jacoco.xml
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.test_all == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Formatting (Prettier)
        run: pnpm format:check
      # test = Vitest with coverage; fails below each package's line threshold.
      - run: pnpm turbo run lint typecheck test build
      - name: Coverage paths relative to the repo root (for SonarQube Cloud)
        run: |
          for pkg in storefront admin packages/api-client packages/observability packages/ui; do
            sed -i "s#^SF:#SF:frontend/$pkg/#" "$pkg/coverage/lcov.info"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          retention-days: 3
          path: |
            frontend/storefront/coverage/lcov.info
            frontend/admin/coverage/lcov.info
            frontend/packages/api-client/coverage/lcov.info
            frontend/packages/observability/coverage/lcov.info
            frontend/packages/ui/coverage/lcov.info

  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vaabhi
          POSTGRES_USER: vaabhi
          POSTGRES_PASSWORD: vaabhi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaabhi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build and start backend
        run: |
          (cd backend && ./mvnw -B -q package -DskipTests)
          # The demo profile loads the demo catalogue (never used in production).
          SPRING_PROFILES_ACTIVE=demo nohup java -jar backend/target/app.jar > backend.log 2>&1 &
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Build storefront and admin
        run: pnpm turbo run build --filter=storefront --filter=admin
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
      - name: Start storefront and admin
        working-directory: frontend
        run: |
          cp -r storefront/.next/static storefront/.next/standalone/storefront/.next/
          (cd storefront/.next/standalone && PORT=3000 HOSTNAME=127.0.0.1 API_URL=http://localhost:8080 \
            nohup node storefront/server.js > ../../../../storefront.log 2>&1 &)
          nohup python3 -m http.server 3001 --bind 127.0.0.1 --directory admin/out > ../admin.log 2>&1 &
      - name: Wait for the stack
        run: |
          wait_for() { for _ in $(seq 1 60); do curl -fsS "$1" >/dev/null 2>&1 && return 0; sleep 2; done; echo "$1 did not come up"; return 1; }
          wait_for http://localhost:8080/actuator/health/readiness
          wait_for http://localhost:3000/api/health
          wait_for http://localhost:3001/

      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend/e2e
      - run: pnpm exec playwright test
        working-directory: frontend/e2e
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            frontend/e2e/playwright-report
            frontend/e2e/test-results
            backend.log
            storefront.log
            admin.log

  sonar:
    name: sonar
    needs: [changes, backend, frontend]
    # Runs even when backend or frontend was skipped (unchanged), but not after a failure.
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      needs.backend.result != 'failure' && needs.frontend.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Skip when SonarQube Cloud is not configured
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN secret is not set; skipping analysis."
      - uses: actions/checkout@v7
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0 # full history: new-code detection and blame
      - uses: actions/setup-java@v6
        if: env.SONAR_TOKEN != ''
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/download-artifact@v7
        if: env.SONAR_TOKEN != '' && needs.backend.result == 'success'
        with:
          name: backend-build
          path: backend/target
      - uses: actions/download-artifact@v7
        if: env.SONAR_TOKEN != '' && needs.frontend.result == 'success'
        with:
          name: frontend-coverage
          path: frontend
      - name: Compile backend (unchanged in this run; Sonar needs the bytecode)
        if: env.SONAR_TOKEN != '' && needs.backend.result != 'success'
        run: ./mvnw -B -q test-compile
        working-directory: backend
      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8

  # ---- pull requests ----

  admin-preview:
    needs: [changes, frontend]
    # Fork and Dependabot PRs get no secrets.
    if: >-
      github.event_name == 'pull_request' && needs.frontend.result == 'success' &&
      github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-admin.yml
    with:
      environment: preview
    secrets: inherit

  # ---- main ----

  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: [changes, backend, frontend, e2e, sonar]
    if: >-
      !cancelled() && github.event_name != 'pull_request' && needs.changes.outputs.deployable == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/vaabhi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        if: needs.backend.result == 'success'
        with:
          name: backend-build
          path: backend/target
      # Every deploy pulls both images by commit SHA, so build the jar even when the backend is unchanged.
      - uses: actions/setup-java@v6
        if: needs.backend.result != 'success'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build backend jar (unchanged in this run)
        if: needs.backend.result != 'success'
        run: ./mvnw -B -q package -DskipTests
        working-directory: backend
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-backend
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - id: meta-storefront
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-storefront
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/storefront/Dockerfile
          push: true
          tags: ${{ steps.meta-storefront.outputs.tags }}
          labels: ${{ steps.meta-storefront.outputs.labels }}
          # NEXT_PUBLIC_* values are inlined at build time.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL || 'https://api.vaabhi.com' }}
            NEXT_PUBLIC_CF_IMAGES_ACCOUNT_HASH=${{ vars.CF_IMAGES_ACCOUNT_HASH }}
            NEXT_PUBLIC_FARO_URL=${{ vars.FARO_URL_STOREFRONT }}
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=storefront
          cache-to: type=gha,scope=storefront,mode=max

  # Both deploys use the production environment and start together after publish, so a single
  # "Review deployments" approval covers them.
  deploy-vps:
    needs: publish
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ github.sha }}
    secrets: inherit

  deploy-admin:
    needs: [changes, publish]
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-admin.yml
    with:
      environment: production
    secrets: inherit

  smoke:
    needs: [deploy-vps, deploy-admin]
    if: >-
      !cancelled() && needs.deploy-vps.result == 'success' && needs.deploy-admin.result != 'failure'
    uses: ./.github/workflows/smoke.yml
    with:
      expected_commit: ${{ github.sha }}
