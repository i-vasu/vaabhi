name: Deploy to VPS

# Called by the CI/CD pipeline after publish, and run manually for rollbacks
# (Actions → Deploy to VPS → Run workflow → image tag = commit SHA of a good build).
on:
  workflow_call:
    inputs:
      image_tag:
        description: "Image tag (commit SHA) to deploy"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (git SHA); use for manual deploys and rollbacks"
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production-vps
      cancel-in-progress: false
    # Add "Required reviewers" to this environment in repo settings for manual approval.
    environment: production
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Skip when the VPS is not configured
        if: env.VPS_HOST == ''
        run: echo "::notice::VPS_HOST secret is not set; skipping deploy."
      - uses: actions/checkout@v7
        if: env.VPS_HOST != ''
        with:
          ref: ${{ env.IMAGE_TAG }}
      - name: Copy compose file and deploy script
        if: env.VPS_HOST != ''
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "infra/docker-compose.prod.yml,infra/deploy.sh"
          target: /opt/vaabhi
          strip_components: 1
      - name: Deploy
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1
        env:
          # Optional: when set (production environment secrets), deploy.sh writes them into /opt/vaabhi/.env.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE_TAG,R2_ACCOUNT_ID,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY
          script: IMAGE_TAG="$IMAGE_TAG" sh /opt/vaabhi/deploy.sh

  # The pipeline runs its own smoke job after both deploys; manual runs check here.
  smoke:
    needs: deploy
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/smoke.yml
    with:
      expected_commit: ${{ inputs.image_tag }}
