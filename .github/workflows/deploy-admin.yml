name: Deploy admin (Cloudflare Pages)

# Called by the CI/CD pipeline (preview on PRs, production on main) and runnable manually.
on:
  workflow_call:
    inputs:
      environment:
        description: "preview or production"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: "preview or production"
        type: choice
        options: [production, preview]
        default: production

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}-admin-${{ github.ref }}
      cancel-in-progress: ${{ inputs.environment == 'preview' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter admin build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL || 'https://api.vaabhi.com' }}
          NEXT_PUBLIC_FARO_URL: ${{ vars.FARO_URL_ADMIN }}
          NEXT_PUBLIC_DEPLOY_ENV: ${{ inputs.environment }}
      - name: Skip when Cloudflare is not configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN secret is not set; built but not deployed."
      - name: Ensure Pages project, custom domain and DNS
        if: env.CLOUDFLARE_API_TOKEN != '' && inputs.environment == 'production'
        working-directory: .
        run: bash infra/cloudflare/ensure-pages.sh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_DOMAIN: ${{ vars.ADMIN_DOMAIN || 'admin.vaabhi.com' }}
      - uses: cloudflare/wrangler-action@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/admin/out --project-name=vaabhi-admin --branch=${{ github.head_ref || github.ref_name }}

  # The pipeline runs its own smoke job after both deploys; manual production runs check here.
  smoke:
    needs: deploy
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    uses: ./.github/workflows/smoke.yml
