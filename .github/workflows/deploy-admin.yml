name: Deploy admin (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths: ["frontend/admin/**", "frontend/packages/**", "frontend/pnpm-lock.yaml", ".github/workflows/deploy-admin.yml"]
  pull_request:
    paths: ["frontend/admin/**", "frontend/packages/**", "frontend/pnpm-lock.yaml", ".github/workflows/deploy-admin.yml"]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Fork and Dependabot PRs have no access to secrets.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter admin build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          NEXT_PUBLIC_FARO_URL: ${{ vars.FARO_URL_ADMIN }}
          NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}
          NEXT_PUBLIC_DEPLOY_ENV: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      - name: Skip when Cloudflare is not configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN secret is not set; built but not deployed."
      - name: Ensure Pages project, custom domain and DNS
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name != 'pull_request'
        working-directory: .
        run: bash infra/cloudflare/ensure-pages.sh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_DOMAIN: ${{ vars.ADMIN_DOMAIN || 'admin.vaabhi.com' }}
      - uses: cloudflare/wrangler-action@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/admin/out --project-name=vaabhi-admin --branch=${{ github.head_ref || github.ref_name }}

  smoke:
    needs: deploy
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/smoke.yml
