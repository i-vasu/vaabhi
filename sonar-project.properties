# SonarQube Cloud: one project for the whole monorepo (Java backend + TypeScript frontend).
sonar.organization=i-vasu
sonar.projectKey=i-vasu_vaabhi
sonar.projectName=vaabhi

sonar.sources=backend/src/main/java,frontend/storefront/src,frontend/admin/src,frontend/packages/api-client/src,frontend/packages/observability/src,frontend/packages/ui/src
sonar.tests=backend/src/test/java,frontend/storefront/src,frontend/admin/src,frontend/packages/api-client/src,frontend/packages/observability/src,frontend/e2e/tests
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/src/test/**,frontend/packages/api-client/src/schema.d.ts
sonar.test.inclusions=backend/src/test/**,**/*.test.ts,**/*.test.tsx,**/src/test/**,frontend/e2e/tests/**

sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.java.libraries=/home/runner/.m2/repository/**/*.jar

# Coverage: JaCoCo (unit + integration tests merged) and Vitest lcov. Same exclusions as the local gates.
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/storefront/coverage/lcov.info,frontend/admin/coverage/lcov.info,frontend/packages/api-client/coverage/lcov.info,frontend/packages/observability/coverage/lcov.info
sonar.coverage.exclusions=backend/src/main/java/com/vaabhi/VaabhiApplication.java,**/app/layout.tsx,**/instrumentation.ts

# Fail the CI job when the quality gate fails.
sonar.qualitygate.wait=true
